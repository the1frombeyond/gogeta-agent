name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.0.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest tests/ -m 'not integration' --timeout=30 -q --no-isolate
        env:
          GOGETA_HOME: /tmp/gogeta-test-home

      - name: Security scan
        run: uv run osv-scan --locked

  tui-build:
    name: TUI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Build TUI
        run: |
          cd ui-tui
          npm ci
          npm run build

      - name: Upload TUI build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tui-dist
          path: ui-tui/dist/

  create-release:
    name: Create GitHub Release
    needs: [quality-gate, tui-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate checksums
        run: |
          sha256sum install.ps1 install.sh > checksums.txt
          echo "" >> checksums.txt
          sha256sum scripts/install.ps1 scripts/install.sh >> checksums.txt

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp install.ps1 release/install.ps1
          cp install.sh release/install.sh
          cp checksums.txt release/checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@c95fe6059398b8a0d2f0b1b4b0e69c0a8ba34ef3  # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Gogeta ${{ github.ref_name }}
          body_path: docs/release/release_notes.md
          draft: false
          prerelease: false
          files: |
            release/*
